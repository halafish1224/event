<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>AIMYON 歌詞學習地圖 - 模組切換版</title>
  <style>
    :root {
      --bg-mustard: #DAB642; /* 芥末黃 */
      --text-green: #1A3B28; /* 墨綠色 */
      --card-bg: #FCFBF4;    /* 米白色 */
      --accent-red: #D14936; /* 點綴紅 */
      --border-dark: #1A3B28;
      --tab-inactive: #B89B36;
    }

    body {
      background-color: var(--bg-mustard);
      color: var(--text-green);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* 頂部導航列 (UI/UX: 費茲定律，大按鈕易點擊) */
    .nav-tabs {
      display: flex;
      width: 100%;
      max-width: 650px;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      padding: 14px 0;
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--text-green);
      background-color: var(--tab-inactive);
      border: 3px solid var(--border-dark);
      border-radius: 12px;
      box-shadow: 3px 3px 0px var(--border-dark);
      cursor: pointer;
      text-align: center;
      transition: all 0.1s ease;
    }

    .tab-btn.active {
      background-color: var(--card-bg);
      color: var(--accent-red);
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--border-dark);
      border-bottom-width: 5px;
    }

    .card-container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border: 4px solid var(--border-dark);
      border-radius: 20px; 
      box-shadow: 6px 6px 0px var(--border-dark);
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .badge {
      background-color: var(--text-green);
      color: var(--bg-mustard);
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 12px;
      font-size: 1.2rem;
      border: 2px solid var(--border-dark);
      margin-bottom: 8px;
    }

    .kanji {
      font-size: 5rem;
      font-weight: 900;
      margin: 0;
      line-height: 1.1;
      color: var(--border-dark);
    }

    .reading {
      font-size: 2rem;
      color: var(--accent-red);
      font-weight: bold;
      margin-bottom: 12px;
    }

    /* 資訊區塊：高對比、大字體、易讀 */
    .info-box {
      width: 100%;
      background: #F2EEDB;
      border: 3px dashed var(--border-dark);
      border-radius: 12px;
      padding: 14px;
      margin: 6px 0;
      box-sizing: border-box;
      text-align: left;
    }

    .song-box {
      width: 100%;
      background: var(--text-green);
      color: var(--card-bg);
      border: 3px solid var(--border-dark);
      border-radius: 12px;
      padding: 16px;
      margin: 6px 0;
      box-sizing: border-box;
      text-align: left;
    }

    .label {
      font-size: 1.1rem;
      font-weight: 900;
      margin-bottom: 6px;
      border-bottom: 2px solid currentcolor;
      display: inline-block;
      padding-bottom: 2px;
    }

    .song-box .label {
      color: var(--bg-mustard);
      border-bottom: 2px solid var(--bg-mustard);
    }

    .content-text {
      font-size: 1.4rem;
      font-weight: 900;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    /* 假名注音 (Furigana) 樣式 */
    rt {
      font-size: 0.85rem;
      color: var(--accent-red);
      font-weight: 900;
    }

    .memory-text {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--accent-red);
      line-height: 1.4;
    }

    .song-text {
      font-size: 1.3rem;
      font-weight: bold;
      line-height: 1.5;
    }
    
    .song-name {
      color: var(--bg-mustard);
      font-size: 1.5rem;
      font-weight: 900;
      display: block;
      margin-bottom: 2px;
    }

    .album-name {
      color: #A3D9C9;
      font-size: 1rem;
      display: block;
      margin-bottom: 8px;
      border-bottom: 1px dashed #A3D9C9;
      padding-bottom: 6px;
    }

    .controls {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 650px;
      margin-top: 16px;
    }

    .btn {
      flex: 1;
      padding: 18px 0;
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--card-bg);
      background-color: var(--text-green);
      border: 3px solid var(--border-dark);
      border-radius: 12px;
      box-shadow: 4px 4px 0px var(--border-dark);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0px var(--border-dark);
    }

    .btn-audio {
      background-color: var(--accent-red);
    }

    .progress {
      margin-top: 12px;
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--text-green);
    }
  </style>
</head>
<body>

  <!-- 頂部模組導航列 (UI/UX 優化：快速意群切換) -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="setCategory('noun')" id="tab-noun">名詞 (20)</button>
    <button class="tab-btn" onclick="setCategory('verb')" id="tab-verb">動詞 (10)</button>
    <button class="tab-btn" onclick="setCategory('adj')" id="tab-adj">形容詞 (10)</button>
  </div>

  <div class="card-container">
    <div id="typeBadge" class="badge">讀取中...</div>
    <div id="kanjiText" class="kanji">愛</div>
    <div id="readingText" class="reading">あい (ai)</div>
    
    <div class="info-box">
      <div class="label">解釋與用法：</div>
      <div id="usageText" class="content-text"></div>
      
      <div class="label">日文發音諧音記憶：</div>
      <div id="memoryText" class="memory-text"></div>
    </div>

    <div class="song-box">
      <div class="label">名曲意涵解析：</div>
      <div id="songText" class="song-text"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-audio" onclick="speakCurrentWord()">🔊 日文朗讀</button>
  </div>

  <div class="controls">
    <button class="btn" style="background-color: #555;" onclick="prevCard()">上一張</button>
    <button class="btn" onclick="nextCard()">下一張</button>
  </div>

  <div id="progressText" class="progress">1 / 20</div>

  <script>
    const wordList = [
      // ====== 名詞 TOP20 ======
      { cat: "noun", type: "名詞 01", kanji: "愛", reading: "あい (ai)", meaning: "愛、愛情", usage: "<ruby>愛<rt>あい</rt></ruby>を<ruby>伝<rt>つた</rt></ruby>える", memory: "阿姨(a-i)給你滿滿的愛。", songExample: "<span class='song-name'>《愛を伝えたいだとか》</span><span class='album-name'>💿 『青春のエキサイトメント』</span>【解析】渴望傳達愛意卻又笨拙傲嬌的心境。" },
      { cat: "noun", type: "名詞 02", kanji: "心", reading: "こころ (kokoro)", meaning: "心靈、內心", usage: "<ruby>裸<rt>はだか</rt></ruby>の<ruby>心<rt>こころ</rt></ruby>", memory: "發音像心跳聲「叩叩囉(ko-ko-ro)」代表心臟跳動。", songExample: "<span class='song-name'>《裸の心》</span><span class='album-name'>💿 『おいしいパスタがあると聞いて』</span>【解析】終於卸下防備，用赤裸的心勇敢迎接感情。" },
      { cat: "noun", type: "名詞 03", kanji: "君", reading: "きみ (kimi)", meaning: "你(親密)", usage: "<ruby>君<rt>きみ</rt></ruby>はロックを<ruby>聴<rt>き</rt></ruby>かない", memory: "指著對方說「奇密(ki-mi)」的你，親密的稱呼。", songExample: "<span class='song-name'>《君はロックを聴かない》</span><span class='album-name'>💿 『青春のエキサイトメント』</span>【解析】藉由「你」不聽搖滾樂，刻畫單戀的青春酸楚。" },
      { cat: "noun", type: "名詞 04", kanji: "夜", reading: "よる (yoru)", meaning: "夜晚", usage: "<ruby>今夜<rt>こんや</rt></ruby>", memory: "夜晚太黑沒有燈，只能「摸路(yo-ru)」。", songExample: "<span class='song-name'>《今夜このまま》</span><span class='album-name'>💿 『瞬間的シックスセンス』</span>【解析】營造都會男女孤獨感，想將時間停在「今晚」。" },
      { cat: "noun", type: "名詞 05", kanji: "目", reading: "め (me)", meaning: "眼睛", usage: "<ruby>目<rt>め</rt></ruby>を<ruby>閉<rt>と</rt></ruby>じる", memory: "羊「咩(me)咩」的眼睛水汪汪的很可愛。", songExample: "<span class='song-name'>《マリーゴールド》</span><span class='album-name'>💿 『瞬間的シックスセンス』</span>【解析】「眼神交會瞬間」，捕捉戀愛中最細微的接觸。" },
      { cat: "noun", type: "名詞 06", kanji: "歌", reading: "うた (uta)", meaning: "歌曲", usage: "<ruby>歌<rt>うた</rt></ruby>を<ruby>歌<rt>うた</rt></ruby>う", memory: "唱歌唱到「無他(u-ta)」的忘我境界。", songExample: "<span class='song-name'>《貴方解剖純愛歌 〜死ね〜》</span><span class='album-name'>💿 『tamago』</span>【解析】將病態愛意化作純愛之歌，音樂是情感載體。" },
      { cat: "noun", type: "名詞 07", kanji: "言葉", reading: "ことば (kotoba)", meaning: "言語", usage: "<ruby>言葉<rt>ことば</rt></ruby>にする", memory: "話說得太多，「口頭吧(ko-to-ba)」都講到乾了。", songExample: "<span class='song-name'>《マリーゴールド》</span><span class='album-name'>💿 『瞬間的シックスセンス』</span>【解析】「無法化作言語」，感情太深反而不知如何開口。" },
      { cat: "noun", type: "名詞 08", kanji: "空", reading: "そら (sora)", meaning: "天空", usage: "<ruby>空<rt>そら</rt></ruby>の<ruby>青<rt>あお</rt></ruby>さ", memory: "抬頭看天空，「搜啦(so-ra)」一聲就有飛機飛過。", songExample: "<span class='song-name'>《空の青さを知る人よ》</span><span class='album-name'>💿 『おいしいパスタがあると聞いて』</span>【解析】廣闊清澈的天空，象徵成熟後面對青春的遺憾。" },
      { cat: "noun", type: "名詞 09", kanji: "声", reading: "こえ (koe)", meaning: "聲音", usage: "<ruby>声<rt>こえ</rt></ruby>を<ruby>聞<rt>き</rt></ruby>く", memory: "遠處傳來呼喚，發出「可欸(ko-e)」的聲音。", songExample: "<span class='song-name'>《満月の夜なら》</span><span class='album-name'>💿 『瞬間的シックスセンス』</span>【解析】滿月之夜的私密互動，喘息聲成為情慾催化劑。" },
      { cat: "noun", type: "名詞 10", kanji: "雨", reading: "あめ (ame)", meaning: "雨水", usage: "<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>る", memory: "下雨天不能出門，只好在家吃「阿梅(a-me)」。", songExample: "<span class='song-name'>《生きていたんだよな》</span><span class='album-name'>💿 『青春のエキサイトメント』</span>【解析】社會事件現場，雨水作為洗刷生命痕跡的沉重意象。" },
      { cat: "noun", type: "名詞 11", kanji: "風", reading: "かぜ (kaze)", meaning: "風", usage: "<ruby>風<rt>かぜ</rt></ruby>が<ruby>吹<rt>ふ</rt></ruby>く", memory: "大風吹過，把桌上的「卡紙(ka-ze)」全都吹走了。", songExample: "<span class='song-name'>《ハルノヒ》</span><span class='album-name'>💿 『おいしいパスタがあると聞いて』</span>【解析】微風吹拂，描繪車站求婚的日常風景，平凡溫馨。" },
      { cat: "noun", type: "名詞 12", kanji: "部屋", reading: "へや (heya)", meaning: "房間", usage: "<ruby>自分<rt>じぶん</rt></ruby>の<ruby>部屋<rt>へや</rt></ruby>", memory: "進到房間，對室友大喊一聲「嘿呀(he-ya)」。", songExample: "<span class='song-name'>《愛を伝えたいだとか》</span><span class='album-name'>💿 『青春のエキサイトメント』</span>【解析】昏暗房間不僅是空間，更是充滿內心小劇場的世界。" },
      { cat: "noun", type: "名詞 13", kanji: "夢", reading: "ゆめ (yume)", meaning: "夢想", usage: "<ruby>夢<rt>ゆめ</rt></ruby>を<ruby>見<rt>み</rt></ruby>る", memory: "晚上做的夢境總是特別「幽美(yu-me)」。", songExample: "<span class='song-name'>《夢追いベンガル》</span><span class='album-name'>💿 『瞬間的シックスセンス』</span>【解析】像孟加拉貓一樣不顧一切追逐夢想的野性與掙扎。" },
      { cat: "noun", type: "名詞 14", kanji: "涙", reading: "なみだ (namida)", meaning: "眼淚", usage: "<ruby>涙<rt>なみだ</rt></ruby>を<ruby>流<rt>なが</rt></ruby>す", memory: "眼淚像「那米大(na-mi-da)」的珍珠一樣掉下來。", songExample: "<span class='song-name'>《裸の心》</span><span class='album-name'>💿 『おいしいパスタがあると聞いて』</span>【解析】深夜回憶戀情時，眼淚不自覺掉下來的脆弱。" },
      { cat: "noun", type: "名詞 15", kanji: "体", reading: "からだ (karada)", meaning: "身體", usage: "<ruby>体中<rt>からだじゅう</rt></ruby>", memory: "身體要健康，才能「卡拉大(ka-ra-da)」聲唱歌。", songExample: "<span class='song-name'>《ふたりの世界》</span><span class='album-name'>💿 『青春のエキサイトメント』</span>【解析】同居的兩人，連彼此身體與溫度都極度依賴。" },
      { cat: "noun", type: "名詞 16", kanji: "朝", reading: "あさ (asa)", meaning: "早晨", usage: "<ruby>朝<rt>あさ</rt></ruby>が<ruby>来<rt>く</rt></ruby>る", memory: "早上起床伸個大懶腰，喊一聲「啊～爽(a-sa)」。", songExample: "<span class='song-name'>《朝陽》</span><span class='album-name'>💿 『おいしいパスタがあると聞いて』</span>【解析】刺眼清晨陽光，與混亂低潮的心境形成強烈對比。" },
      { cat: "noun", type: "名詞 17", kanji: "花", reading: "はな (hana)", meaning: "花朵", usage: "<ruby>花<rt>はな</rt></ruby>が<ruby>咲<rt>さ</rt></ruby>く", memory: "聞花香要用鼻子，鼻子發音也是「哈那(ha-na)」。", songExample: "<span class='song-name'>《桜が降る夜は》</span><span class='album-name'>💿 『瞳へ落ちるよレコード』</span>【解析】常以花開花落，隱喻愛情的盛開與短暫易逝。" },
      { cat: "noun", type: "名詞 18", kanji: "影", reading: "かげ (kage)", meaning: "影子", usage: "<ruby>影<rt>かげ</rt></ruby>を<ruby>追<rt>お</rt></ruby>う", memory: "影子就像是「卡給(ka-ge)」你身邊甩不掉的跟屁蟲。", songExample: "<span class='song-name'>《マリーゴールド》</span><span class='album-name'>💿 『瞬間的シックスセンス』</span>【解析】搖曳的影子烘托出夏日戀情那股泛黃的懷舊感。" },
      { cat: "noun", type: "名詞 19", kanji: "街", reading: "まち (machi)", meaning: "街道", usage: "<ruby>街<rt>まち</rt></ruby>を<ruby>走<rt>はし</rt></ruby>る", memory: "在熱鬧的街道上逛街，剛好遇到好「麻吉(ma-chi)」。", songExample: "<span class='song-name'>《生きていたんだよな》</span><span class='album-name'>💿 『青春のエキサイトメント』</span>【解析】喧囂街道上冷漠的人群，與生死議題形成強烈對比。" },
      { cat: "noun", type: "名詞 20", kanji: "姿", reading: "すがた (sugata)", meaning: "身影", usage: "<ruby>後<rt>うし</rt></ruby>ろ<ruby>姿<rt>すがた</rt></ruby>", memory: "看到對方美麗的姿態，心裡覺得「速尬意(su-ga-ta)」。", songExample: "<span class='song-name'>《初恋が泣いている》</span><span class='album-name'>💿 『瞳へ落ちるよレコード』</span>【解析】在人群中找尋著熟悉的身姿，將對舊愛的執念具象化。" },

      // ====== 動詞 TOP10 ======
      { cat: "verb", type: "動詞 01", kanji: "会う", reading: "あう (au)", meaning: "見面", usage: "<ruby>君<rt>きみ</rt></ruby>に<ruby>会<rt>あ</rt></ruby>いたい", memory: "兩人在街角相遇見面，「啊嗚(a-u)」地驚呼。", songExample: "<span class='song-name'>《ハルノヒ》</span><span class='album-name'>💿 『おいしいパスタがあると聞いて』</span>【解析】在月台會合見面，唱出日常相聚的終極幸福感。" },
      { cat: "verb", type: "動詞 02", kanji: "聴く", reading: "きく (kiku)", meaning: "傾聽", usage: "ロックを<ruby>聴<rt>き</rt></ruby>かない", memory: "聽到好聽的音樂，覺得這首歌非常「奇酷(ki-ku)」。", songExample: "<span class='song-name'>《君はロックを聴かない》</span><span class='album-name'>💿 『青春のエキサイトメント』</span>【解析】對方不願傾聽自己的音樂，帶出單戀的酸楚。" },
      { cat: "verb", type: "動詞 03", kanji: "笑う", reading: "わらう (warau)", meaning: "笑", usage: "<ruby>二人<rt>ふたり</rt></ruby>で<ruby>笑<rt>わら</rt></ruby>う", memory: "笑得非常開心，發出「哇哈哈(wa-ra-u)」的聲音。", songExample: "<span class='song-name'>《愛を知るまでは》</span><span class='album-name'>💿 『瞳へ落ちるよレコード』</span>【解析】希望能笑著活下去，展現低潮也要笑著面對的生命力。" },
      { cat: "verb", type: "動詞 04", kanji: "泣く", reading: "なく (naku)", meaning: "哭泣", usage: "<ruby>泣<rt>な</rt></ruby>きそうな<ruby>顔<rt>かお</rt></ruby>", memory: "哭得太大聲，被念說「那哭(na-ku)什麼啦？」。", songExample: "<span class='song-name'>《初恋が泣いている》</span><span class='album-name'>💿 『瞳へ落ちるよレコード』</span>【解析】將初戀擬人化在電線桿旁哭泣，表現失去的悲痛。" },
      { cat: "verb", type: "動詞 05", kanji: "知る", reading: "しる (shiru)", meaning: "知道", usage: "<ruby>君<rt>きみ</rt></ruby>を<ruby>知<rt>し</rt></ruby>りたい", memory: "知道感人的真相後，流下「吸嚕(shi-ru)」的眼淚。", songExample: "<span class='song-name'>《空の青さを知る人よ》</span><span class='album-name'>💿 『おいしいパスタがあると聞いて』</span>【解析】「知道」天空多藍，代表經歷挫折歷練變得成熟。" },
      { cat: "verb", type: "動詞 06", kanji: "忘れる", reading: "わすれる (wasureru)", meaning: "忘記", usage: "<ruby>忘<rt>わす</rt></ruby>れられない", memory: "忘記帶東西，驚呼「哇！輸了了(wa-su-re-ru)」。", songExample: "<span class='song-name'>《あのね》</span><span class='album-name'>💿 『猫にジェラシー』</span>【解析】「不想忘記」的執念，無法輕易遺忘過去是她情歌的特色。" },
      { cat: "verb", type: "動詞 07", kanji: "抱きしめる", reading: "だきしめる (dakishimeru)", meaning: "緊抱", usage: "<ruby>強<rt>つよ</rt></ruby>く<ruby>抱<rt>だ</rt></ruby>きしめて", memory: "緊緊抱住對方給他「打氣，是美夢(da-ki-shi-me-ru)」。", songExample: "<span class='song-name'>《マリーゴールド》</span><span class='album-name'>💿 『瞬間的シックスセンス』</span>【解析】將抽象愛意化為最直接的身體接觸與畫面感。" },
      { cat: "verb", type: "動詞 08", kanji: "走る", reading: "はしる (hashiru)", meaning: "奔跑", usage: "<ruby>夜空<rt>よぞら</rt></ruby>を<ruby>走<rt>はし</rt></ruby>る", memory: "拚命奔跑喘個不停，發出「哈氣嚕(ha-shi-ru)」。", songExample: "<span class='song-name'>《双葉》</span><span class='album-name'>💿 『瞳へ落ちるよレコード』</span>【解析】不顧一切向前奔跑成長，充滿青春期衝勁與無畏。" },
      { cat: "verb", type: "動詞 09", kanji: "話す", reading: "はなす (hanasu)", meaning: "說話", usage: "<ruby>朝<rt>あさ</rt></ruby>まで<ruby>話<rt>はな</rt></ruby>そう", memory: "兩個人聊個不停，講話講到「哈那死(ha-na-su)」。", songExample: "<span class='song-name'>《ふたりの世界》</span><span class='album-name'>💿 『青春のエキサイトメント』</span>【解析】隨意聊著只有彼此懂的話語，平淡對話堆疊甜蜜。" },
      { cat: "verb", type: "動詞 10", kanji: "離す", reading: "はなす (hanasu)", meaning: "放開", usage: "<ruby>手<rt>て</rt></ruby>をつないで<ruby>離<rt>はな</rt></ruby>さない", memory: "放開手不牽了，發音一樣是「哈那死(ha-na-su)」。", songExample: "<span class='song-name'>《マリーゴールド》</span><span class='album-name'>💿 『瞬間的シックスセンス』</span>【解析】「請不要離開我」，表達想將對方牢牢抓緊的願望。" },

      // ====== 形容詞 TOP10 ======
      { cat: "adj", type: "形容詞 01", kanji: "青い", reading: "あおい (aoi)", meaning: "藍色、青澀", usage: "<ruby>青<rt>あお</rt></ruby>い<ruby>空<rt>そら</rt></ruby>", memory: "看到蔚藍大海，發出「啊～喔～伊(a-o-i)」的讚嘆。", songExample: "<span class='song-name'>《空の青さを知る人よ》</span><span class='album-name'>💿 『おいしいパスタがあると聞いて』</span>【解析】常代表著未成熟的青春、清澈卻帶點憂傷的歲月。" },
      { cat: "adj", type: "形容詞 02", kanji: "痛い", reading: "いたい (itai)", meaning: "疼痛、難過", usage: "<ruby>胸<rt>むね</rt></ruby>が<ruby>痛<rt>いた</rt></ruby>い", memory: "踢到桌角，痛到大喊「唉太(i-tai)痛了吧！」", songExample: "<span class='song-name'>《貴方解剖純愛歌 〜死ね〜》</span><span class='album-name'>💿 『tamago』</span>【解析】經常使用「痛」來形容愛情刻骨銘心令人窒息的感受。" },
      { cat: "adj", type: "形容詞 03", kanji: "愛しい", reading: "いとしい (itoshii)", meaning: "心愛的", usage: "<ruby>愛<rt>いと</rt></ruby>しい<ruby>人<rt>ひと</rt></ruby>", memory: "感情「意投(i-to)」氣合，深深愛慕(shi-i)對方。", songExample: "<span class='song-name'>《マリーゴールド》</span><span class='album-name'>💿 『瞬間的シックスセンス』</span>【解析】比單純喜歡多了一份想好好珍惜、疼愛的厚重情感。" },
      { cat: "adj", type: "形容詞 04", kanji: "寂しい", reading: "さびしい (sabishii)", meaning: "寂寞的", usage: "<ruby>寂<rt>さび</rt></ruby>しい<ruby>夜<rt>よる</rt></ruby>", memory: "孤獨感如同「殺必死(sa-bi-shi)」，寂寞得快死掉。", songExample: "<span class='song-name'>《今夜このまま》</span><span class='album-name'>💿 『瞬間的シックスセンス』</span>【解析】完美捕捉現代都會男女無法排解的微小孤獨片刻。" },
      { cat: "adj", type: "形容詞 05", kanji: "優しい", reading: "やさしい (yasashii)", meaning: "溫柔的", usage: "<ruby>優<rt>やさ</rt></ruby>しい<ruby>声<rt>こえ</rt></ruby>", memory: "溫柔的人總被說「呀！傻傻(ya-sa-shi)的」付出。", songExample: "<span class='song-name'>《ハルノヒ》</span><span class='album-name'>💿 『おいしいパスタがあると聞いて』</span>【解析】日常不經意的溫柔舉動，是穩定期戀情中最讓人安心的特質。" },
      { cat: "adj", type: "形容詞 06", kanji: "甘い", reading: "あまい (amai)", meaning: "甜美的", usage: "<ruby>甘<rt>あま</rt></ruby>い<ruby>匂<rt>にお</rt></ruby>い", memory: "「阿嬤(a-ma)」偷偷塞給你的糖果永遠最甜美。", songExample: "<span class='song-name'>《満月の夜なら》</span><span class='album-name'>💿 『瞬間的シックスセンス』</span>【解析】巧妙運用嗅覺形容詞，帶出男女間情慾流動的危險氛圍。" },
      { cat: "adj", type: "形容詞 07", kanji: "強い", reading: "つよい (tsuyoi)", meaning: "強烈的", usage: "<ruby>強<rt>つよ</rt></ruby>い<ruby>風<rt>かぜ</rt></ruby>", memory: "諧音台語「粗勇(tsu-yo)」，代表身體與意志堅強。", songExample: "<span class='song-name'>《愛を知るまでは》</span><span class='album-name'>💿 『瞳へ落ちるよレコード』</span>【解析】在懂得愛之前都要活下去的「堅強」，充滿生命力吶喊。" },
      { cat: "adj", type: "形容詞 08", kanji: "悲しい", reading: "かなしい (kanashii)", meaning: "悲傷的", usage: "<ruby>悲<rt>かな</rt></ruby>しい<ruby>歌<rt>うた</rt></ruby>", memory: "「看哪～夕(ka-na-shi)陽」，看著日落湧上哀愁。", songExample: "<span class='song-name'>《生きていたんだよな》</span><span class='album-name'>💿 『青春のエキサイトメント』</span>【解析】不加修飾地用最直接的悲傷，表達無力感與生存叩問。" },
      { cat: "adj", type: "形容詞 09", kanji: "眩しい", reading: "まぶしい (mabushii)", meaning: "耀眼的", usage: "<ruby>眩<rt>まぶ</rt></ruby>しい<ruby>光<rt>ひかり</rt></ruby>", memory: "太刺眼，連「馬都不視(ma-bu-shi)」轉頭避開。", songExample: "<span class='song-name'>《マリーゴールド》</span><span class='album-name'>💿 『瞬間的シックスセンス』</span>【解析】形容刻骨銘心的戀情像夏日豔陽一樣閃耀到無法忘懷。" },
      { cat: "adj", type: "形容詞 10", kanji: "嬉しい", reading: "うれしい (ureshii)", meaning: "開心的", usage: "<ruby>嬉<rt>うれ</rt></ruby>しい<ruby>知<rt>し</rt></ruby>らせ", memory: "開心發出「嗚！」歡呼說「來洗(re-shi)」澡慶祝！", songExample: "<span class='song-name'>《ハート》</span><span class='album-name'>💿 『瞳へ落ちるよレコード』</span>【解析】在日常小事中感受到被愛的喜悅，最純粹的情緒表達。" }
    ];

    let currentCategory = 'noun';
    let currentIndex = 0;
    let filteredList = [];

    // 初始化與分類切換邏輯
    function setCategory(cat) {
      currentCategory = cat;
      currentIndex = 0;
      
      // 更新按鈕 UI 狀態
      document.getElementById('tab-noun').classList.remove('active');
      document.getElementById('tab-verb').classList.remove('active');
      document.getElementById('tab-adj').classList.remove('active');
      document.getElementById(`tab-${cat}`).classList.add('active');

      // 過濾該詞性的資料庫
      filteredList = wordList.filter(item => item.cat === currentCategory);
      renderCard();
    }

    function renderCard() {
      const item = filteredList[currentIndex];
      document.getElementById('typeBadge').innerText = item.type;
      document.getElementById('kanjiText').innerText = item.kanji;
      document.getElementById('readingText').innerText = item.reading;
      
      document.getElementById('usageText').innerHTML = `${item.meaning} (${item.usage})`;
      document.getElementById('memoryText').innerText = item.memory;
      document.getElementById('songText').innerHTML = item.songExample;
      document.getElementById('progressText').innerText = `${currentIndex + 1} / ${filteredList.length}`;
    }

    function nextCard() {
      if (currentIndex < filteredList.length - 1) {
        currentIndex++;
        renderCard();
      }
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        renderCard();
      }
    }

    function speakCurrentWord() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        
        // 抓取當前單字，並過濾掉 HTML 標籤取得純文字給 TTS 唸 (純日文發音)
        const item = filteredList[currentIndex];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = item.usage;
        const cleanUsage = tempDiv.textContent || tempDiv.innerText;
        
        const textToSpeak = `${item.kanji}。 ${cleanUsage}`;
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'ja-JP';
        utterance.rate = 0.85; 
        window.speechSynthesis.speak(utterance);
      } else {
        alert("您的瀏覽器不支援語音合成朗讀機能");
      }
    }

    // 啟動預設渲染 (名詞)
    setCategory('noun');
  </script>
</body>
</html>
