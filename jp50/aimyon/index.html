<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIMYON 歌詞日文單字卡 - 聯想記憶版</title>
  <style>
    :root {
      --bg-mustard: #DAB642; /* 芥末黃 */
      --text-green: #1A3B28; /* 墨綠色 */
      --card-bg: #FCFBF4;
      --accent-red: #D14936;
      --border-dark: #1A3B28;
    }

    body {
      background-color: var(--bg-mustard);
      color: var(--text-green);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    header {
      text-align: center;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.8rem;
      margin: 0;
      color: var(--text-green);
      letter-spacing: 2px;
      font-weight: 900;
    }

    .card-container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border: 4px solid var(--border-dark);
      /* AIMYON 手繪不規則框線感 */
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; 
      box-shadow: 6px 6px 0px var(--border-dark);
      padding: 30px 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .badge {
      background-color: var(--text-green);
      color: var(--bg-mustard);
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 12px;
      font-size: 1.1rem;
      border: 2px solid var(--border-dark);
      margin-bottom: 16px;
    }

    .kanji {
      font-size: 5.5rem;
      font-weight: 900;
      margin: 5px 0 0 0;
      line-height: 1.1;
      color: var(--border-dark);
    }

    .reading {
      font-size: 2.2rem;
      color: var(--accent-red);
      font-weight: bold;
      margin-bottom: 20px;
    }

    .meaning-box {
      width: 100%;
      background: #F2EEDB;
      border: 3px dashed var(--border-dark);
      border-radius: 12px;
      padding: 16px;
      margin: 10px 0;
      box-sizing: border-box;
      text-align: left;
    }

    .label {
      font-size: 1rem;
      color: #333;
      font-weight: bold;
      margin-bottom: 6px;
      border-bottom: 2px solid var(--border-dark);
      display: inline-block;
    }

    .content-text {
      font-size: 1.5rem;
      font-weight: 900;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .memory-text {
      font-size: 1.35rem;
      font-weight: bold;
      color: var(--accent-red);
      line-height: 1.4;
    }

    .controls {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 500px;
      margin-top: 24px;
    }

    .btn {
      flex: 1;
      padding: 20px 0;
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--card-bg);
      background-color: var(--text-green);
      border: 3px solid var(--border-dark);
      border-radius: 16px;
      box-shadow: 4px 4px 0px var(--border-dark);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0px var(--border-dark);
    }

    .btn-audio {
      background-color: var(--accent-red);
    }

    .progress {
      margin-top: 16px;
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--text-green);
    }
  </style>
</head>
<body>

  <header>
    <h1>★ AIMYON 歌詞單字記憶卡 ★</h1>
  </header>

  <div class="card-container">
    <div id="typeBadge" class="badge">讀取中...</div>
    <div id="kanjiText" class="kanji">愛</div>
    <div id="readingText" class="reading">あい (ai)</div>
    
    <div class="meaning-box">
      <div class="label">解釋與用法：</div>
      <div id="usageText" class="content-text">愛、愛情 (愛を伝える)</div>
      
      <div class="label">諧音聯想記憶：</div>
      <div id="memoryText" class="memory-text">發音「阿伊(a-i)」，就像見到愛人時發出嬌嗔。</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-audio" onclick="speakCurrentWord()">🔊 語音朗讀</button>
  </div>

  <div class="controls">
    <button class="btn" style="background-color: #555;" onclick="prevCard()">上一張</button>
    <button class="btn" onclick="nextCard()">下一張</button>
  </div>

  <div id="progressText" class="progress">1 / 40</div>

  <script>
    // 易讀易改的 JSON 格式資料庫 (名詞20 + 動詞10 + 形容詞10)
    const wordList = [
      // ====== 名詞 TOP20 ======
      { type: "名詞 01", kanji: "愛", reading: "あい (ai)", meaning: "愛、愛情", usage: "愛を伝える", memory: "阿姨(a-i)給你滿滿的愛。" },
      { type: "名詞 02", kanji: "心", reading: "こころ (kokoro)", meaning: "心靈、內心", usage: "裸の心", memory: "發音像心跳聲「叩叩囉(ko-ko-ro)」，代表心臟跳動。" },
      { type: "名詞 03", kanji: "君", reading: "きみ (kimi)", meaning: "你(親密)", usage: "君はロックを聴かない", memory: "指著對方說「奇密(ki-mi)」的你，代表親密的稱呼。" },
      { type: "名詞 04", kanji: "夜", reading: "よる (yoru)", meaning: "夜晚", usage: "今夜(こんや)", memory: "夜晚太黑沒有燈，只能「摸路(yo-ru)」。" },
      { type: "名詞 05", kanji: "目", reading: "め (me)", meaning: "眼睛", usage: "目を閉じる", memory: "羊「咩(me)咩」的眼睛水汪汪的很可愛。" },
      { type: "名詞 06", kanji: "歌", reading: "うた (uta)", meaning: "歌曲", usage: "歌を歌う", memory: "唱歌唱到「無他(u-ta)」的忘我境界。" },
      { type: "名詞 07", kanji: "言葉", reading: "ことば (kotoba)", meaning: "言語", usage: "言葉にする", memory: "話說得太多，「口頭吧(ko-to-ba)」都講到乾了。" },
      { type: "名詞 08", kanji: "空", reading: "そら (sora)", meaning: "天空", usage: "空の青さ", memory: "抬頭看天空，「搜啦(so-ra)」一聲就有飛機飛過。" },
      { type: "名詞 09", kanji: "声", reading: "こえ (koe)", meaning: "聲音", usage: "声を聞く", memory: "遠處傳來呼喚，發出「可欸(ko-e)」的聲音。" },
      { type: "名詞 10", kanji: "雨", reading: "あめ (ame)", meaning: "雨水", usage: "雨が降る", memory: "下雨天不能出門，只好在家吃「阿梅(a-me)」(梅子)。" },
      { type: "名詞 11", kanji: "風", reading: "かぜ (kaze)", meaning: "風", usage: "風が吹く", memory: "大風吹過，把桌上的「卡紙(ka-ze)」全都吹走了。" },
      { type: "名詞 12", kanji: "部屋", reading: "へや (heya)", meaning: "房間", usage: "自分の部屋", memory: "進到房間，對室友大喊一聲「嘿呀(he-ya)」。" },
      { type: "名詞 13", kanji: "夢", reading: "ゆめ (yume)", meaning: "夢想、夢境", usage: "夢を見る", memory: "晚上做的夢境總是特別「幽美(yu-me)」。" },
      { type: "名詞 14", kanji: "涙", reading: "なみだ (namida)", meaning: "眼淚", usage: "涙を流す", memory: "眼淚像「那米大(na-mi-da)」的珍珠一樣掉下來。" },
      { type: "名詞 15", kanji: "体", reading: "からだ (karada)", meaning: "身體", usage: "体中", memory: "身體要健康，才能「卡拉大(ka-ra-da)」聲唱歌(卡拉OK)。" },
      { type: "名詞 16", kanji: "朝", reading: "あさ (asa)", meaning: "早晨", usage: "朝が来る", memory: "早上起床伸個大懶腰，喊一聲「啊～爽(a-sa)」。" },
      { type: "名詞 17", kanji: "花", reading: "はな (hana)", meaning: "花朵", usage: "花が咲く", memory: "聞花香要用鼻子，日文的鼻子發音也是「哈那(ha-na)」。" },
      { type: "名詞 18", kanji: "影", reading: "かげ (kage)", meaning: "影子", usage: "影を追う", memory: "影子就像是「卡給(ka-ge)」你身邊甩不掉的跟屁蟲。" },
      { type: "名詞 19", kanji: "街", reading: "まち (machi)", meaning: "街道", usage: "街を走る", memory: "在熱鬧的街道上逛街，剛好遇到好「麻吉(ma-chi)」。" },
      { type: "名詞 20", kanji: "姿", reading: "すがた (sugata)", meaning: "身影", usage: "後ろ姿", memory: "看到對方美麗的姿態，心裡覺得「速尬意(su-ga-ta)」(台語很喜歡)。" },
      
      // ====== 動詞 TOP10 ======
      { type: "動詞 01", kanji: "会う", reading: "あう (au)", meaning: "見面", usage: "君に会いたい", memory: "兩人在街角相遇見面，「啊嗚(a-u)」地驚呼了一聲。" },
      { type: "動詞 02", kanji: "聴く", reading: "きく (kiku)", meaning: "傾聽", usage: "ロックを聴かない", memory: "聽到好聽的音樂，覺得這首歌非常「奇酷(ki-ku)」。" },
      { type: "動詞 03", kanji: "笑う", reading: "わらう (warau)", meaning: "笑", usage: "二人で笑う", memory: "笑得非常開心，發出「哇哈哈(wa-ra-u)」的聲音。" },
      { type: "動詞 04", kanji: "泣く", reading: "なく (naku)", meaning: "哭泣", usage: "泣きそうな顔", memory: "哭得太大聲，被別人念說「那哭(na-ku)什麼啦？」。" },
      { type: "動詞 05", kanji: "知る", reading: "しる (shiru)", meaning: "知道", usage: "君を知りたい", memory: "知道感人的真相後，流下「吸嚕(shi-ru)」的鼻涕眼淚。" },
      { type: "動詞 06", kanji: "忘れる", reading: "わすれる (wasureru)", meaning: "忘記", usage: "忘れられない", memory: "忘記帶重要東西，驚呼「哇！輸了了(wa-su-re-ru)」(台語)。" },
      { type: "動詞 07", kanji: "抱きしめる", reading: "だきしめる (dakishimeru)", meaning: "緊抱", usage: "強く抱きしめて", memory: "緊緊抱住對方，給他「打氣，是美夢(da-ki-shi-me-ru)」。" },
      { type: "動詞 08", kanji: "走る", reading: "はしる (hashiru)", meaning: "奔跑", usage: "夜空を走る", memory: "一直拚命奔跑，喘個不停發出「哈氣嚕(ha-shi-ru)」的聲音。" },
      { type: "動詞 09", kanji: "話す", reading: "はなす (hanasu)", meaning: "說話", usage: "朝まで話そう", memory: "兩個人聊個不停，一直講話講到「哈那死(ha-na-su)」(台語)。" },
      { type: "動詞 10", kanji: "離す", reading: "はなす (hanasu)", meaning: "放開", usage: "手をつないで離さない", memory: "放開手不牽了，也是同樣的發音「哈那死(ha-na-su)」。" },

      // ====== 形容詞 TOP10 ======
      { type: "形容詞 01", kanji: "青い", reading: "あおい (aoi)", meaning: "藍色、青澀", usage: "青い空", memory: "看到蔚藍大海，發出「啊～喔～伊(a-o-i)」的讚嘆。" },
      { type: "形容詞 02", kanji: "痛い", reading: "いたい (itai)", meaning: "疼痛、難過", usage: "胸が痛い", memory: "踢到桌角，痛到大喊「唉太(i-tai)痛了吧！」" },
      { type: "形容詞 03", kanji: "愛しい", reading: "いとしい (itoshii)", meaning: "心愛的", usage: "愛しい人", memory: "感情「意投(i-to)」氣合，深深愛慕(shi-i)對方。" },
      { type: "形容詞 04", kanji: "寂しい", reading: "さびしい (sabishii)", meaning: "寂寞的", usage: "寂しい夜", memory: "孤獨感如同「殺必死(sa-bi-shi)」，寂寞得快死掉。" },
      { type: "形容詞 05", kanji: "優しい", reading: "やさしい (yasashii)", meaning: "溫柔的", usage: "優しい声", memory: "溫柔的人總被說「呀！傻傻(ya-sa-shi)的」一直付出。" },
      { type: "形容詞 06", kanji: "甘い", reading: "あまい (amai)", meaning: "甜美的", usage: "甘い匂い", memory: "「阿嬤(a-ma)」偷偷塞給你的糖果，永遠是最甜美的。" },
      { type: "形容詞 07", kanji: "強い", reading: "つよい (tsuyoi)", meaning: "強烈的", usage: "強い風", memory: "諧音台語「粗勇(tsu-yo)」，代表身體強壯、意志堅強。" },
      { type: "形容詞 08", kanji: "悲しい", reading: "かなしい (kanashii)", meaning: "悲傷的", usage: "悲しい歌", memory: "「看哪～夕(ka-na-shi)陽」，看著日落湧上悲傷哀愁。" },
      { type: "形容詞 09", kanji: "眩しい", reading: "まぶしい (mabushii)", meaning: "耀眼的", usage: "眩しい光", memory: "光線太刺眼，連「馬都不視(ma-bu-shi)」轉頭避開。" },
      { type: "形容詞 10", kanji: "嬉しい", reading: "うれしい (ureshii)", meaning: "開心的", usage: "嬉しい知らせ", memory: "開心到發出「嗚！」歡呼，說著「來洗(re-shi)」澡慶祝吧！" }
    ];

    let currentIndex = 0;

    function renderCard() {
      const item = wordList[currentIndex];
      document.getElementById('typeBadge').innerText = item.type;
      document.getElementById('kanjiText').innerText = item.kanji;
      document.getElementById('readingText').innerText = item.reading;
      document.getElementById('usageText').innerText = `${item.meaning} (${item.usage})`;
      document.getElementById('memoryText').innerText = item.memory;
      document.getElementById('progressText').innerText = `${currentIndex + 1} / ${wordList.length}`;
    }

    function nextCard() {
      if (currentIndex < wordList.length - 1) {
        currentIndex++;
        renderCard();
      }
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        renderCard();
      }
    }

    function speakCurrentWord() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const item = wordList[currentIndex];
        const textToSpeak = `${item.kanji}。 ${item.usage}`;
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'ja-JP';
        utterance.rate = 0.85; 
        window.speechSynthesis.speak(utterance);
      } else {
        alert("您的瀏覽器不支援語音合成朗讀機能");
      }
    }

    // 啟動渲染
    renderCard();
  </script>
</body>
</html>
