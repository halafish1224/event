<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 防止搜尋引擎收錄 -->
  <meta name="robots" content="noindex, nofollow">
  <title>AIMYON 歌詞單字記憶卡 - 旗艦解析版</title>
  <style>
    :root {
      --bg-mustard: #DAB642; /* 芥末黃 */
      --text-green: #1A3B28; /* 墨綠色 */
      --card-bg: #FCFBF4;    /* 米白色 */
      --accent-red: #D14936; /* 點綴紅 */
      --border-dark: #1A3B28;
    }

    body {
      background-color: var(--bg-mustard);
      color: var(--text-green);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    header {
      text-align: center;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.8rem;
      margin: 0;
      color: var(--text-green);
      letter-spacing: 2px;
      font-weight: 900;
    }

    .card-container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border: 4px solid var(--border-dark);
      border-radius: 20px; 
      box-shadow: 6px 6px 0px var(--border-dark);
      padding: 24px 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .badge {
      background-color: var(--text-green);
      color: var(--bg-mustard);
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 12px;
      font-size: 1.2rem;
      border: 2px solid var(--border-dark);
      margin-bottom: 12px;
    }

    .kanji {
      font-size: 5.5rem;
      font-weight: 900;
      margin: 0;
      line-height: 1.1;
      color: var(--border-dark);
    }

    .reading {
      font-size: 2.2rem;
      color: var(--accent-red);
      font-weight: bold;
      margin-bottom: 16px;
    }

    /* 資訊區塊：高對比、大字體、易讀 */
    .info-box {
      width: 100%;
      background: #F2EEDB;
      border: 3px dashed var(--border-dark);
      border-radius: 12px;
      padding: 16px;
      margin: 8px 0;
      box-sizing: border-box;
      text-align: left;
    }

    /* 歌曲解析專屬區塊：反轉配色，強化視覺區隔 */
    .song-box {
      width: 100%;
      background: var(--text-green);
      color: var(--card-bg);
      border: 3px solid var(--border-dark);
      border-radius: 12px;
      padding: 20px 16px;
      margin: 8px 0;
      box-sizing: border-box;
      text-align: left;
    }

    .label {
      font-size: 1.1rem;
      font-weight: 900;
      margin-bottom: 8px;
      border-bottom: 2px solid currentcolor;
      display: inline-block;
      padding-bottom: 2px;
    }

    .song-box .label {
      color: var(--bg-mustard);
      border-bottom: 2px solid var(--bg-mustard);
    }

    .content-text {
      font-size: 1.5rem;
      font-weight: 900;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    /* 假名注音 (Furigana) 樣式，專為老花眼放大並變色 */
    rt {
      font-size: 0.85rem;
      color: var(--accent-red);
      font-weight: 900;
    }

    .memory-text {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--accent-red);
      line-height: 1.4;
    }

    .song-text {
      font-size: 1.35rem;
      font-weight: bold;
      line-height: 1.6;
    }
    
    .song-name {
      color: var(--bg-mustard);
      font-size: 1.6rem;
      font-weight: 900;
      display: block;
      margin-bottom: 4px;
    }

    .album-name {
      color: #A3D9C9;
      font-size: 1.15rem;
      display: block;
      margin-bottom: 12px;
      border-bottom: 1px dashed #A3D9C9;
      padding-bottom: 8px;
    }

    .controls {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 650px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 20px 0;
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--card-bg);
      background-color: var(--text-green);
      border: 3px solid var(--border-dark);
      border-radius: 16px;
      box-shadow: 4px 4px 0px var(--border-dark);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0px var(--border-dark);
    }

    .btn-audio {
      background-color: var(--accent-red);
    }

    .progress {
      margin-top: 16px;
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--text-green);
    }
  </style>
</head>
<body>

  <header>
    <h1>★ AIMYON 歌詞單字庫 ★</h1>
  </header>

  <div class="card-container">
    <div id="typeBadge" class="badge">讀取中...</div>
    <div id="kanjiText" class="kanji">愛</div>
    <div id="readingText" class="reading">あい (ai)</div>
    
    <div class="info-box">
      <div class="label">解釋與用法：</div>
      <div id="usageText" class="content-text"></div>
      
      <div class="label">發音聯想記憶：</div>
      <div id="memoryText" class="memory-text"></div>
    </div>

    <div class="song-box">
      <div class="label">名曲意涵解析：</div>
      <div id="songText" class="song-text"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-audio" onclick="speakCurrentWord()">🔊 語音</button>
  </div>

  <div class="controls">
    <button class="btn" style="background-color: #555;" onclick="prevCard()">上一張</button>
    <button class="btn" onclick="nextCard()">下一張</button>
  </div>

  <div id="progressText" class="progress">1 / 40</div>

    let currentIndex = 0;

    function renderCard() {
      const item = wordList[currentIndex];
      document.getElementById('typeBadge').innerText = item.type;
      document.getElementById('kanjiText').innerText = item.kanji;
      document.getElementById('readingText').innerText = item.reading;
      
      // 使用 innerHTML 才能正確解析 <ruby> 標籤
      document.getElementById('usageText').innerHTML = `${item.meaning} (${item.usage})`;
      document.getElementById('memoryText').innerText = item.memory;
      document.getElementById('songText').innerHTML = item.songExample;
      document.getElementById('progressText').innerText = `${currentIndex + 1} / ${wordList.length}`;
    }

    function nextCard() {
      if (currentIndex < wordList.length - 1) {
        currentIndex++;
        renderCard();
      }
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        renderCard();
      }
    }

    function speakCurrentWord() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        
        // 抓取當前單字，並透過建立隱藏容器過濾掉 HTML <ruby> 標籤，取得純文字給語音唸
        const item = wordList[currentIndex];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = item.usage;
        const cleanUsage = tempDiv.textContent || tempDiv.innerText;
        
        const textToSpeak = `${item.kanji}。 ${cleanUsage}`;
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'ja-JP';
        utterance.rate = 0.85; 
        window.speechSynthesis.speak(utterance);
      } else {
        alert("您的瀏覽器不支援語音合成朗讀機能");
      }
    }

    // 啟動渲染第一張
    renderCard();
