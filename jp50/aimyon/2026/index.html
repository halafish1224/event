<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>AIMYON 歌詞學習地圖 - 2021-2026 近期名曲特化版</title>
  <style>
    :root {
      --bg-mustard: #DAB642; 
      --text-green: #1A3B28; 
      --card-bg: #FCFBF4;    
      --accent-red: #D14936; 
      --border-dark: #1A3B28;
      --tab-inactive: #B89B36;
    }

    body {
      background-color: var(--bg-mustard);
      color: var(--text-green);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* 導航列 */
    .nav-tabs {
      display: flex;
      width: 100%;
      max-width: 650px;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab-btn {
      flex: 1;
      padding: 14px 0;
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--text-green);
      background-color: var(--tab-inactive);
      border: 3px solid var(--border-dark);
      border-radius: 12px;
      box-shadow: 3px 3px 0px var(--border-dark);
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      background-color: var(--card-bg);
      color: var(--accent-red);
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--border-dark);
      border-bottom-width: 5px;
    }

    .card-container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border: 4px solid var(--border-dark);
      border-radius: 20px; 
      box-shadow: 6px 6px 0px var(--border-dark);
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .kanji { font-size: 4.5rem; font-weight: 900; margin: 0; color: var(--border-dark); }
    .reading { font-size: 2rem; color: var(--accent-red); font-weight: bold; margin-bottom: 12px; }

    /* 資訊區塊通用 */
    .box {
      width: 100%;
      border-radius: 12px;
      padding: 14px;
      margin: 6px 0;
      box-sizing: border-box;
      text-align: left;
    }

    .memory-box { background: #F2EEDB; border: 3px dashed var(--border-dark); }
    .lyrics-box { background: var(--text-green); color: var(--card-bg); border: 3px solid var(--border-dark); }
    
    .label {
      font-size: 1.1rem; font-weight: 900; margin-bottom: 6px;
      border-bottom: 2px solid currentcolor; display: inline-block; padding-bottom: 2px;
    }
    
    .lyrics-box .label { color: var(--bg-mustard); border-bottom-color: var(--bg-mustard); }

    .memory-text { font-size: 1.35rem; font-weight: bold; color: var(--accent-red); line-height: 1.4; }
    
    /* 歌詞特化顯示 (老花眼友善) */
    .lyrics-quote {
      background: rgba(255,255,255,0.1);
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
      border-left: 5px solid var(--bg-mustard);
    }

    .lyrics-line { font-size: 1.5rem; font-weight: 900; line-height: 1.8; margin: 4px 0; }
    
    /* 注音優化 */
    rt { font-size: 0.9rem; color: #F4A261; font-weight: 900; }

    .song-attr {
      font-size: 1rem; color: #A3D9C9; text-align: right; font-weight: bold; margin-top: 8px;
    }

    .explanation-text {
      font-size: 1.25rem; font-weight: bold; line-height: 1.6; color: #E8E8E8;
    }

    .copyright-note {
      font-size: 1rem; color: var(--bg-mustard); text-align: center; margin-top: 16px; border-top: 1px dashed #A3D9C9; padding-top: 8px;
    }

    .controls { display: flex; gap: 12px; width: 100%; max-width: 650px; margin-top: 16px; }
    .btn {
      flex: 1; padding: 16px 0; font-size: 1.5rem; font-weight: 900; color: var(--card-bg);
      background-color: var(--text-green); border: 3px solid var(--border-dark);
      border-radius: 12px; box-shadow: 4px 4px 0px var(--border-dark); cursor: pointer;
    }
    .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0px var(--border-dark); }
    .btn-audio { background-color: var(--accent-red); }
    .progress { margin-top: 12px; font-size: 1.2rem; font-weight: 900; }
  </style>
</head>
<body>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="setCategory('noun')" id="tab-noun">名詞 (5)</button>
    <button class="tab-btn" onclick="setCategory('verb')" id="tab-verb">動詞 (5)</button>
    <button class="tab-btn" onclick="setCategory('adj')" id="tab-adj">形容詞 (5)</button>
  </div>

  <div class="card-container">
    <div id="kanjiText" class="kanji">讀取中</div>
    <div id="readingText" class="reading"></div>
    
    <div class="box memory-box">
      <div class="label">解釋與記憶法：</div>
      <div id="memoryText" class="memory-text"></div>
    </div>

    <div class="box lyrics-box">
      <div class="label" id="songTitle">名曲解析</div>
      <div class="lyrics-quote" id="lyricsQuote"></div>
      <div class="explanation-text" id="explanationText"></div>
      <div class="copyright-note">※ 欲學習完整歌曲，請至 Google 搜尋該首曲目歌詞。</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-audio" onclick="speakCurrentWord()">🔊 日文朗讀</button>
  </div>
  <div class="controls">
    <button class="btn" style="background-color: #555;" onclick="prevCard()">上一張</button>
    <button class="btn" onclick="nextCard()">下一張</button>
  </div>
  <div id="progressText" class="progress">1 / 5</div>

  <script>
    // 嚴選 2021~2026 近期名曲 15 選 (考量效能與精緻度，各取 TOP 5 深入解析)

      { cat: "noun", kanji: "涙", reading: "なみだ (namida)", meaning: "眼淚",

      { cat: "noun", kanji: "心", reading: "こころ (kokoro)", meaning: "心靈、內心",

        explanation: "【歌詞賞析】「ハート(Heart)」與「心(Kokoro)」交錯使用，將自己笨拙、容易迷失的內心狀態展露無遺，卻又堅定地選擇了對方。" },

      // ====== 動詞 ======
      { cat: "verb", kanji: "会う", reading: "あう (au)", meaning: "見面",

    let currentCategory = 'noun';
    let currentIndex = 0;
    let filteredList = [];

    function setCategory(cat) {
      currentCategory = cat;
      currentIndex = 0;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${cat}`).classList.add('active');
      filteredList = wordList.filter(item => item.cat === currentCategory);
      renderCard();
    }

    function renderCard() {
      const item = filteredList[currentIndex];
      document.getElementById('kanjiText').innerText = item.kanji;
      document.getElementById('readingText').innerText = `${item.reading} - ${item.meaning}`;
      document.getElementById('memoryText').innerText = item.memory;
      document.getElementById('songTitle').innerText = item.songTitle;
      document.getElementById('lyricsQuote').innerHTML = item.lyrics;
      document.getElementById('explanationText').innerText = item.explanation;
      document.getElementById('progressText').innerText = `${currentIndex + 1} / ${filteredList.length}`;
    }

    function nextCard() {
      if (currentIndex < filteredList.length - 1) { currentIndex++; renderCard(); }
    }

    function prevCard() {
      if (currentIndex > 0) { currentIndex--; renderCard(); }
    }

    function speakCurrentWord() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const item = filteredList[currentIndex];
        
        // 過濾 HTML <ruby> 標籤與換行，取得供語音唸出的純淨日文歌詞
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = item.lyrics;
        const lyricsText = tempDiv.textContent.replace('詞/曲：あいみょん', ''); // 避免唸出版權宣告

        const textToSpeak = `${item.kanji}。 ${lyricsText}`;
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'ja-JP';
        utterance.rate = 0.8; // 稍微放慢，利於開車聆聽
        window.speechSynthesis.speak(utterance);
      } else {
        alert("您的設備不支援語音功能。");
      }
    }

    setCategory('noun');
  </script>
</body>
</html>
