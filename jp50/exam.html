<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>50 音直覺反應訓練器｜JP50</title>
<style>
:root{--bg:#f4f1e9;--paper:#fffdf8;--ink:#242a28;--muted:#68706c;--line:#d8d5cd;--accent:#1f6f5f;--ok:#34775b;--bad:#b64f4a;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);padding:20px;line-height:1.6}a{color:var(--accent);text-underline-offset:4px}.shell{max-width:880px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.top a{font-weight:800}.container{background:var(--paper);padding:clamp(20px,4vw,36px);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 34px rgba(48,43,34,.08)}h1{margin:0 0 6px;font-size:clamp(1.7rem,5vw,2.7rem)}.lead{margin:0;color:var(--muted)}#question-box{font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;font-size:clamp(2.8rem,12vw,5rem);font-weight:900;color:var(--accent);margin:22px 0 8px;letter-spacing:.03em}#message{min-height:34px;font-weight:800;margin-bottom:14px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;color:var(--muted);font-size:.9rem}.stats span{padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:#fff}.kana-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.kana-btn{background:#eef2ef;border:1px solid #d3ddd8;border-radius:10px;min-height:58px;padding:8px;font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;font-size:1.35rem;font-weight:800;cursor:pointer}.kana-btn:hover{background:#e1ebe5}.kana-btn:focus-visible{outline:3px solid #b76528;outline-offset:2px}.kana-btn.correct{background:var(--ok)!important;color:white;border-color:var(--ok)}.kana-btn.wrong{background:var(--bad)!important;color:white;border-color:var(--bad)}.empty{visibility:hidden}.note{margin-top:16px;padding:12px 14px;background:#fff8df;border-left:4px solid #d4ae43;border-radius:8px;color:#5d5542}@media(max-width:520px){body{padding:12px}.kana-grid{gap:6px}.kana-btn{min-height:52px;font-size:1.15rem}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="shell">
<div class="top"><a href="./">← JP50 總入口</a><a href="./learn.html">完整 50 音字卡</a></div>
<div class="container">
<h1>50 音直覺反應訓練器</h1>
<p class="lead">看到羅馬字後，先在腦中叫出聲音，再點對應平假名。完整收錄基本 46 音。</p>
<div id="question-box" aria-live="polite">準備中…</div>
<div id="message" role="status" aria-live="polite"></div>
<div class="stats"><span id="score">正確 0</span><span id="attempts">作答 0</span><span id="streak">連續 0</span></div>
<div class="kana-grid" id="grid" aria-label="基本 46 音選項"></div>
<p class="note">答錯不會換題；先修正同一題，再前進。若字形卡住，可使用下方「50 音速讀對照」。</p>
</div>
</div>
<script>
const kanaRows=[
[['あ','a'],['い','i'],['う','u'],['え','e'],['お','o']],
[['か','ka'],['き','ki'],['く','ku'],['け','ke'],['こ','ko']],
[['さ','sa'],['し','shi'],['す','su'],['せ','se'],['そ','so']],
[['た','ta'],['ち','chi'],['つ','tsu'],['て','te'],['と','to']],
[['な','na'],['に','ni'],['ぬ','nu'],['ね','ne'],['の','no']],
[['は','ha'],['ひ','hi'],['ふ','fu'],['へ','he'],['ほ','ho']],
[['ま','ma'],['み','mi'],['む','mu'],['め','me'],['も','mo']],
[['や','ya'],null,['ゆ','yu'],null,['よ','yo']],
[['ら','ra'],['り','ri'],['る','ru'],['れ','re'],['ろ','ro']],
[['わ','wa'],null,['を','wo'],null,['ん','n']]
];
const kanaData=kanaRows.flat().filter(Boolean).map(([kana,romaji])=>({kana,romaji}));
let currentQuestion=null,correct=0,attempts=0,streak=0,lastRomaji='';
const grid=document.getElementById('grid');
for(const row of kanaRows){for(const item of row){if(!item){const spacer=document.createElement('span');spacer.className='kana-btn empty';spacer.setAttribute('aria-hidden','true');grid.append(spacer);continue;}const [kana,romaji]=item;const btn=document.createElement('button');btn.type='button';btn.className='kana-btn';btn.textContent=kana;btn.dataset.romaji=romaji;btn.setAttribute('aria-label',kana);btn.addEventListener('click',()=>checkAnswer(romaji,btn));grid.append(btn);}}
function updateStats(){document.getElementById('score').textContent='正確 '+correct;document.getElementById('attempts').textContent='作答 '+attempts;document.getElementById('streak').textContent='連續 '+streak;}
function nextQuestion(){document.querySelectorAll('.kana-btn').forEach(btn=>btn.classList.remove('correct','wrong'));document.getElementById('message').textContent='';let pool=kanaData.filter(x=>x.romaji!==lastRomaji);currentQuestion=pool[Math.floor(Math.random()*pool.length)];lastRomaji=currentQuestion.romaji;document.getElementById('question-box').textContent=currentQuestion.romaji;}
function checkAnswer(selectedRomaji,clickedBtn){attempts++;if(selectedRomaji===currentQuestion.romaji){correct++;streak++;clickedBtn.classList.add('correct');document.getElementById('message').textContent='答對了。';document.getElementById('message').style.color='var(--ok)';updateStats();setTimeout(nextQuestion,650);}else{streak=0;clickedBtn.classList.add('wrong');document.getElementById('message').textContent='再試一次：先把羅馬字念出聲。';document.getElementById('message').style.color='var(--bad)';updateStats();setTimeout(()=>clickedBtn.classList.remove('wrong'),450);}}
updateStats();nextQuestion();
</script>
<script src="./kana-quick.js" defer></script>
</body>
</html>
