        * {

            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "PingFang TC", sans-serif;

            color: var(--text-dark);
            line-height: 1.6;
            padding: 15px;
            font-size: 20px; /* 大字體 */
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background-color: var(--dark-green);
            color: var(--white);
            padding: 24px 20px;
            border-radius: 12px;
            text-align: center;
            border-bottom: 8px solid var(--mustard-yellow);
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.8rem;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 1.1rem;
            color: #e0e0e0;
        }

        .tab-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            flex: 1;
            min-width: 120px;
            padding: 16px 10px;
            font-size: 1.2rem;
            font-weight: bold;
            border: 3px solid var(--dark-green);
            background-color: var(--white);
            color: var(--dark-green);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--dark-green);
            color: var(--white);
            border-color: var(--mustard-yellow);
        }

        .content-section {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .content-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--white);
            border: 2px solid var(--dark-green);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 6px 12px rgba(27, 59, 43, 0.1);
        }

        .card-title {
            font-size: 1.5rem;
            color: var(--dark-green);
            border-left: 10px solid var(--mustard-yellow);
            padding-left: 12px;
            margin-bottom: 16px;
            font-weight: bold;
        }

        /* 課表表格 */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th, td {
            border: 2px solid #ccc;
            padding: 12px 8px;
            text-align: center;
            font-size: 1.15rem;
            vertical-align: middle;
        }

        th {
            background-color: var(--dark-green);
            color: var(--white);
            font-size: 1.2rem;
        }

        tr:nth-child(even) { background-color: var(--light-mustard); }
        .lunch-row { background-color: #fff3cd !important; font-weight: bold; color: #856404; }
        .teacher-name { display: block; font-size: 0.95rem; color: #444; margin-top: 4px; }

        .gloria-badge {
            display: inline-block;
            background-color: #6a1b9a;
            color: #ffffff;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 1.1rem;
        }

        /* 行事曆多校標籤 */
        .event-list { list-style: none; }
        .event-item {
            padding: 16px 12px;
            border-bottom: 2px dashed #ccc;
            display: flex;
            align-items: center;
            gap: 12px;
            border-radius: 8px;
            margin-bottom: 6px;
        }
        .event-item:last-child { border-bottom: none; }
        
        /* 當天行程 High Light 高亮顯示 */
        .event-item.is-today {
            background-color: #fff9db !important;
            border: 3px solid #d97706 !important;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
        }

        .today-badge {
            background-color: #d97706;
            color: #ffffff;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 1rem;
            letter-spacing: 1px;
            white-space: nowrap;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .event-date {
            font-weight: bold;
            background-color: var(--mustard-yellow);
            color: var(--dark-green);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 1.15rem;
            min-width: 150px;
            text-align: center;
        }

        .school-badge {
            font-size: 0.95rem;

            padding: 4px 8px;
            border-radius: 6px;
            white-space: nowrap;

        .badge-holiday { background-color: #d97706; }

        .event-desc {
            font-size: 1.25rem;
            font-weight: bold;
            flex: 1;
        }

        /* 天氣預報 */
        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
        }
        .weather-card {
            background-color: var(--bg-light);
            border: 2px solid var(--dark-green);
            border-radius: 10px;
            padding: 15px;
            text-align: center;

            color: #0056b3;
            font-weight: bold;
        }

        function parseEventDates(dateStr) {
            const matches = [...dateStr.matchAll(/(\d{1,2})\/(\d{1,2})/g)];
            if (matches.length === 0) return null;

            const now = new Date();
            const currentYear = now.getFullYear();

            function makeDate(m, d) {
                let yr = currentYear;
                if (now.getMonth() >= 7 && m < 7) yr = currentYear + 1;
                if (now.getMonth() < 7 && m >= 7) yr = currentYear - 1;
                return new Date(yr, m - 1, d, 0, 0, 0, 0);
            }

            const startDate = makeDate(parseInt(matches[0][1]), parseInt(matches[0][2]));
            let endDate = new Date(startDate);

            if (matches.length > 1) {
                endDate = makeDate(parseInt(matches[1][1]), parseInt(matches[1][2]));
            }
            endDate.setHours(23, 59, 59, 999);

            return { startDate, endDate };
        }

        function renderPage() {

                return `<tr><td><b>${row.period}</b></td><td>${row.mon}</td><td>${row.tue}</td><td>${row.wed}</td><td>${row.thu}</td><td>${row.fri}</td></tr>`;
            }).join('');

            // 2. 行事曆渲染 (自動隱藏 3 天前舊行程)
            const calBody = document.getElementById('calendar-body');
            const now = new Date();
            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
            const todayEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);

            const cutoffDate = new Date(todayStart);
            cutoffDate.setDate(cutoffDate.getDate() - 3);

            const filteredEvents = appData.calendar.filter(item => {
                const dates = parseEventDates(item.date);
                if (!dates) return true;
                return dates.endDate >= cutoffDate;
            });

            if (filteredEvents.length === 0) {
                calBody.innerHTML = '<li style="padding:20px; text-align:center; color:#666;">🎉 近期無重大行程</li>';
                return;
            }

            calBody.innerHTML = filteredEvents.map(item => {
                const dates = parseEventDates(item.date);
                let isToday = false;

                if (dates) {
                    isToday = (todayStart <= dates.endDate && todayEnd >= dates.startDate);
                }

                const todayBadge = isToday ? '<span class="today-badge">🔥 今天</span>' : '';
                const itemClass = isToday ? 'event-item is-today' : 'event-item';

                return `
                    <li class="${itemClass}">
                        <span class="event-date">${item.date}</span>
                        <span class="school-badge badge-${item.tag}">${item.school}</span>
                        ${todayBadge}
                        <span class="event-desc">${item.desc}</span>
                    </li>`;
            }).join('');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // 天氣預報 API
        const WMO_CODES = {
            0: { desc: '晴天', icon: '☀️' }, 1: { desc: '晴時多雲', icon: '🌤️' }, 2: { desc: '多雲', icon: '⛅' }, 3: { desc: '陰天', icon: '☁️' },
            45: { desc: '霧', icon: '🌫️' }, 51: { desc: '毛毛雨', icon: '🌧️' }, 61: { desc: '陣雨', icon: '🌦️' }, 63: { desc: '雨天', icon: '🌧️' },
            80: { desc: '陣雨', icon: '🌦️' }, 95: { desc: '雷雨', icon: '⛈️' }
        };

        async function fetchWeather() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=24.86&longitude=121.21&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTaipei');
                const data = await response.json();
                const weatherBody = document.getElementById('weather-body');
                weatherBody.innerHTML = ''; 

                const days = ['日', '一', '二', '三', '四', '五', '六'];

                for(let i=0; i<7; i++) {
                    const dateObj = new Date(data.daily.time[i]);
                    const formattedDate = `${dateObj.getMonth()+1}/${dateObj.getDate()} (${days[dateObj.getDay()]})`;
                    const weather = WMO_CODES[data.daily.weathercode[i]] || { desc: '多雲', icon: '⛅' };
                    const rain = data.daily.precipitation_probability_max[i];
                    const rainClass = rain >= 40 ? 'w-rain high' : 'w-rain';

                    weatherBody.innerHTML += `
                        <div class="weather-card">
                            <div class="w-date">${formattedDate}</div>
                            <div class="w-icon">${weather.icon}</div>
                            <div class="w-temp">${Math.round(data.daily.temperature_2m_min[i])}°C ~ ${Math.round(data.daily.temperature_2m_max[i])}°C</div>
                            <div style="font-size:1.1rem; color:#555;">${weather.desc}</div>
                            <div class="${rainClass}">☔ 降雨機率: ${rain}%</div>
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('weather-body').innerHTML = '<p style="color:red;">天氣資料載入失敗。</p>';
            }
        }

        renderPage();
        fetchWeather();
    </script>
</body>
</html>
