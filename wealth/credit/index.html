<html lang="zh-Hant-TW">
<head>

  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border: #cbd5e1;
      --primary: #1e3a8a;
      --primary-light: #eff6ff;
      --accent: #d97706;
      --accent-bg: #fffbeb;
      --accent-border: #f59e0b;
      --danger-bg: #fef2f2;
      --danger-text: #b91c1c;
      --danger-border: #ef4444;
      --app-btn: #059669;
      --app-btn-hover: #047857;
      --web-btn: #2563eb;
      --web-btn-hover: #1d4ed8;
      --radius: 12px;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      padding: 16px 12px 64px;
    }
    .container { max-width: 1280px; margin: 0 auto; }

    /* Header */
    header {
      background: linear-gradient(135deg, #0b132b 0%, #1c2541 60%, #1e3a8a 100%);
      color: #fff;
      padding: 24px 20px;
      border-radius: var(--radius);
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }
    header h1 { font-size: 1.55rem; font-weight: 800; margin-bottom: 8px; }
    header p { color: #cbd5e1; font-size: 0.92rem; }
    .status-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .tag { background: rgba(255,255,255,0.15); padding: 4px 12px; border-radius: 999px; font-size: 0.8rem; }

    /* Selector Section */
    .selector-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }
    .panel-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    @media (max-width: 820px) {
      .controls-grid { grid-template-columns: 1fr; }
    }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text-main);
      background: #fff;
      outline: none;
      transition: border-color 0.2s;
    }
    select:focus, input[type="text"]:focus {
      border-color: var(--web-btn);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }

    /* Result Card */
    .result-section { margin-bottom: 32px; }
    .store-header-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .store-title-area h2 { font-size: 1.35rem; font-weight: 800; color: #0f172a; }
    .store-category-badge {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary);
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-top: 4px;
    }

    /* Champion Recommendation Callout */
    .champion-callout {
      background: var(--accent-bg);
      border: 2px solid var(--accent-border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 20px;
      position: relative;
    }
    .champion-badge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 4px;
      margin-bottom: 6px;
      letter-spacing: 0.03em;
    }
    .champion-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #78350f;
      margin-bottom: 6px;
    }
    .champion-body { font-size: 0.92rem; color: #78350f; }

    /* Comparison Table */
    .table-container {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow-x: auto;
      box-shadow: var(--shadow);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1020px;
      font-size: 0.9rem;
    }
    th {
      background: #0f172a;
      color: #fff;
      text-align: left;
      padding: 13px 16px;
      font-weight: 600;
      font-size: 0.86rem;
    }
    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    tr:hover td { background: #f8fafc; }
    tr.is-champion td { background: #fffdf5; }
    tr.is-champion td:first-child { border-left: 5px solid var(--accent-border); }

    /* Comparison Box within Table */
    .compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 6px 0;
    }
    @media (max-width: 600px) {
      .compare-grid { grid-template-columns: 1fr; }
    }
    .box-unregistered {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.84rem;
    }
    .box-registered {
      background: #eff6ff;
      border: 1.5px solid #93c5fd;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.84rem;
      color: #1e3a8a;
    }
    .badge-unreg {
      display: inline-block;
      background: #64748b;
      color: #fff;
      font-size: 0.72rem;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .badge-reg {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      font-size: 0.72rem;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .urgent-date {
      display: inline-block;
      background: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid var(--danger-border);
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.8rem;
      margin-top: 3px;
    }

    /* Buttons */
    .btn-wrap { display: flex; flex-direction: column; gap: 6px; }
    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 6px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .btn-web { background: var(--web-btn); color: #fff; }
    .btn-web:hover { background: var(--web-btn-hover); }
    .btn-app { background: var(--app-btn); color: #fff; }
    .btn-app:hover { background: var(--app-btn-hover); }

    .note-text {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.4;
    }
    .empty-state {
      padding: 40px;
      text-align: center;
      background: #fff;
      border-radius: var(--radius);
      border: 1px dashed var(--border);
      color: var(--text-muted);
    }
  </style>
</head>

// 初始化全域變數
let currentCategory = "ALL";
let currentSelectedStoreId = STORE_DATA[0].id;

/**
 * 頁面加載初始化
 */
window.addEventListener('DOMContentLoaded', () => {
  populateStoreDropdown("ALL");
  renderStoreDetails(currentSelectedStoreId);
});

/**
 * 類別選單變更
 */
function onCategorySelectChange() {
  const cat = document.getElementById("catSelect").value;
  currentCategory = cat;
  document.getElementById("searchInput").value = "";
  populateStoreDropdown(cat);
  // 自動選取第一個可用的商店
  const storeSelect = document.getElementById("storeSelect");
  if (storeSelect.options.length > 0) {
    currentSelectedStoreId = storeSelect.value;
    renderStoreDetails(currentSelectedStoreId);
  } else {
    renderEmpty();
  }
}

/**
 * 商店選單變更
 */
function onStoreSelectChange() {
  const storeId = document.getElementById("storeSelect").value;
  currentSelectedStoreId = storeId;
  document.getElementById("searchInput").value = "";
  renderStoreDetails(storeId);
}

/**
 * 關鍵字即時搜尋
 */
function onSearchInput(query) {
  const q = query.trim().toLowerCase();
  if (!q) {
    onCategorySelectChange();
    return;
  }
  const matched = STORE_DATA.filter(s => 
    s.name.toLowerCase().includes(q) || 
    s.categoryLabel.toLowerCase().includes(q) ||
    s.cards.some(c => c.cardName.toLowerCase().includes(q) || c.bank.includes(q))
  );

  const storeSelect = document.getElementById("storeSelect");
  storeSelect.innerHTML = "";
  if (matched.length > 0) {
    matched.forEach(s => {
      const opt = document.createElement("option");
      opt.value = s.id;
      opt.textContent = `${s.name} (${s.categoryLabel})`;
      storeSelect.appendChild(opt);
    });
    currentSelectedStoreId = matched[0].id;
    renderStoreDetails(currentSelectedStoreId);
  } else {
    renderEmpty();
  }
}

/**
 * 動態注入商店下拉選項
 */
function populateStoreDropdown(category) {
  const storeSelect = document.getElementById("storeSelect");
  storeSelect.innerHTML = "";

  const filtered = (category === "ALL") 
    ? STORE_DATA 
    : STORE_DATA.filter(item => item.category === category);

  filtered.forEach(item => {
    const opt = document.createElement("option");
    opt.value = item.id;
    opt.textContent = item.name;
    storeSelect.appendChild(opt);
  });
}

/**
 * 渲染所選商店詳細內容與卡片比較表
 */
function renderStoreDetails(storeId) {
  const store = STORE_DATA.find(s => s.id === storeId);
  const resultArea = document.getElementById("resultArea");
  if (!store) {
    renderEmpty();
    return;
  }

  // 排序：推薦卡排在最前
  const sortedCards = [...store.cards].sort((a, b) => (b.isChampion ? 1 : 0) - (a.isChampion ? 1 : 0));

  let html = `
    <div class="store-header-card">
      <div class="store-title-area">
        <h2>${store.name}</h2>
        <span class="store-category-badge">${store.categoryLabel}</span>
      </div>
      <div style="font-size: 0.88rem; color: var(--text-muted);">
        共匹配 <strong>${store.cards.length}</strong> 張優惠卡片
      </div>
    </div>

    <!-- 推薦用卡冠軍 Callout -->
    <div class="champion-callout">
      <span class="champion-badge">👑 本店刷卡推薦首選（HIGH LIGHT）</span>
      <div class="champion-title">${store.championCard}</div>
      <div class="champion-body">
        ${store.championSummary}
      </div>
    </div>

    <!-- 優惠與登錄比較總表 -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width: 140px;">推薦等級 / 銀行</th>
            <th style="width: 160px;">卡種名稱</th>
            <th style="width: 440px;">優惠詳細比較：【未登錄保底】vs【完成登錄極限】</th>
            <th style="width: 250px;">活動/登錄日期強調 ＆ 判定建議</th>
            <th style="width: 170px;">官方登錄 / APP 入口</th>
          </tr>
        </thead>
        <tbody>
  `;

  sortedCards.forEach(card => {
    const bankInfo = BANK_LINKS[card.bank] || { web: "#", app: "#", appName: "行動銀行" };
    const rowClass = card.isChampion ? "is-champion" : "";
    const champBadge = card.isChampion ? `<span class="champion-badge" style="font-size:0.7rem; padding:1px 6px;">首選 👑</span>` : `<span style="font-size:0.75rem; color:#64748b; font-weight:600;">備選推薦</span>`;

    html += `
      <tr class="${rowClass}">
        <td>
          ${champBadge}<br/>
          <strong style="font-size:1.02rem; color:var(--primary);">${card.bank}銀行</strong>
        </td>
        <td>
          <strong style="font-size:0.98rem;">${card.cardName}</strong>
        </td>
        <td>
          <div class="compare-grid">
            <div class="box-unregistered">
              <span class="badge-unreg">🛡️ 未登錄／免登錄</span><br/>
              ${card.unreg}
            </div>
            <div class="box-registered">
              <span class="badge-reg">⚡ 完成登錄／切換後</span><br/>
              ${card.reg}
            </div>
          </div>
          <div class="note-text">📌 <strong>細節與限制：</strong>${card.note}</div>
        </td>
        <td>
          <span class="urgent-date">${card.dateNotice}</span><br/>
          <div style="margin-top:6px; font-weight:600; color:#334155; font-size:0.86rem;">
            💡 <strong>決策建議：</strong>${card.verdict}
          </div>
        </td>
        <td>
          <div class="btn-wrap">
            <a class="btn-action btn-web" href="${bankInfo.web}" target="_blank" rel="noopener">
              🌐 官方登錄入口
            </a>
            ${bankInfo.coupon ? `
              <a class="btn-action" style="background:#e11d48; color:#fff;" href="${bankInfo.coupon}" target="_blank" rel="noopener">
                🏷️ 日本特店折價券
              </a>
            ` : ''}
            <button class="btn-action btn-app" onclick="openBankApp('${bankInfo.app}', '${bankInfo.web}')">
              📱 開啟 ${bankInfo.appName}
            </button>
          </div>
        </td>
      </tr>
    `;
  });

  html += `
        </tbody>
      </table>
    </div>
  `;

  resultArea.innerHTML = html;
}

function renderEmpty() {
  document.getElementById("resultArea").innerHTML = `
    <div class="empty-state">
      <h3>🔍 找不到符合條件的商店或通路</h3>
      <p style="margin-top: 8px;">請嘗試更換類別或輸入其他關鍵字（如：大國藥妝、BicCamera、淘寶、momo、全聯、虎航）。</p>
    </div>
  `;
}

/**
 * 智慧開啟銀行官方 APP / 網頁登錄
 */
function openBankApp(appScheme, webUrl) {
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  if (!isMobile) {
    window.open(webUrl, '_blank', 'noopener');
    return;
  }
  const start = Date.now();
  window.location.href = appScheme;
  setTimeout(function () {
    if (Date.now() - start < 1600) {
      window.open(webUrl, '_blank', 'noopener');
    }
  }, 1200);
}
