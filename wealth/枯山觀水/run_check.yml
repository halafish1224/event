name: 鈊象現金流自動檢測

on:
  schedule:
    # 每週一上午 9:00 (UTC 1:00) 自動執行一次
    - cron: '0 1 * * 1'
  workflow_dispatch: # 允許手動點擊執行

jobs:
  check-cashflow:
    runs-runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: 執行現金流檢測腳本
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python check_3293_cashflow.py
