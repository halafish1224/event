<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭 KTV 點歌本</title>
    <style>
        :root {
            --primary-color: #3b82f6; 
            --accent-color: #ef4444; 
            --bg-color: #fcfcfc; 
            --text-color: #1a1a1a;
            --border-color: #1a1a1a; 
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#d4d4d4 1px, transparent 1px);
            background-size: 20px 20px; 
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 讓滾動更滑順 */
            scroll-behavior: smooth;
        }

        /* 頂部固定區域 */
        .header {
            width: 100%;
            max-width: 800px; /* 加寬以適應多欄位 */
            padding: 20px 15px;
            box-sizing: border-box;
            background-color: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 3px solid var(--border-color);
            border-bottom-left-radius: 10px 30px;
            border-bottom-right-radius: 30px 10px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
            color: var(--text-color);
            font-weight: 900;
            letter-spacing: 2px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transform: rotate(-1deg);
        }

        .search-container {
            position: relative;
            width: 100%;
        }

        .search-box {
            width: 100%;
            padding: 16px 20px 16px 50px; 
            font-size: 22px;
            font-weight: bold;
            color: var(--text-color);
            border: 3px solid var(--border-color);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            box-sizing: border-box;
            background-color: #fff;
            outline: none;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
        }

        .search-box:focus {
            box-shadow: 6px 6px 0px var(--primary-color);
            transform: translate(-2px, -2px);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            color: var(--border-color);
        }

        /* 總數統計區塊 */
        .stats-bar {
            width: 100%;
            max-width: 800px;
            padding: 0 15px;
            margin-bottom: 10px;
            box-sizing: border-box;
            font-size: 18px;
            font-weight: bold;
            color: #555;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 歌曲清單網格設計 (索引感) */
        .song-list {
            list-style: none;
            padding: 0 15px;
            margin: 0 0 60px 0;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
            
            /* 使用 CSS Grid 達成多欄位，RWD 自動適應 */
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
        }

        /* 每一首歌的列表項目 */
        .song-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background-color: #fff;
            border: 3px solid var(--border-color);
            border-radius: 10px 30px 15px 25px/30px 10px 25px 15px;
            box-shadow: 3px 3px 0px var(--primary-color);
            /* 防止內容溢出 */
            overflow: hidden; 
        }
        
        .song-item:nth-child(even) {
            box-shadow: 3px 3px 0px var(--accent-color);
            border-radius: 20px 10px 30px 15px/15px 25px 10px 30px;
        }

        .song-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 10px;
        }

        .song-name {
            font-size: 26px; /* 適合長輩的大字體 */
            font-weight: 900;
            color: var(--text-color);
            letter-spacing: 1px;
            /* 超過長度時顯示省略號 */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
        }

        .song-id-badge {
            background-color: var(--text-color);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 20px; /* 大編號字體 */
            font-weight: bold;
            font-family: monospace;
            border: 2px solid var(--text-color);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.2);
            transform: rotate(2deg);
            flex-shrink: 0;
        }
        
        .song-item:nth-child(even) .song-id-badge {
            transform: rotate(-2deg);
        }

        .no-result {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: var(--border-color);
            margin-top: 20px;
            padding: 40px;
            background: #fff;
            border: 3px dashed var(--accent-color);
            border-radius: 20px;
            transform: rotate(-1deg);
        }
        
        .note-icon {
            font-size: 30px;
            color: var(--primary-color);
            display: inline-block;
        }
        
        .note-icon-right {
            color: var(--accent-color);
            transform: scaleX(-1);
        }

        /* 回到頂部按鈕 */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: var(--primary-color);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            border: 3px solid var(--border-color);
            box-shadow: 4px 4px 0px var(--border-color);
            cursor: pointer;
            text-decoration: none;
            opacity: 0.9;
            transition: transform 0.2s;
            z-index: 1000;
        }

        .back-to-top:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--border-color);
        }

    </style>
</head>

        const songListContainer = document.getElementById('songList');

        const songCountDisplay = document.getElementById('songCount');

        function renderSongs(songs) {
            songListContainer.innerHTML = '';

            songCountDisplay.textContent = `共 ${songs.length} 首歌`;

            if (songs.length === 0) {
                songListContainer.innerHTML = '<div class="no-result">找不到這首歌唷 💦<br>換個字找找看吧！</div>';
                return;
            }

            songs.forEach(song => {
                const li = document.createElement('li');
                li.className = 'song-item';
                
                li.innerHTML = `
                    <div class="song-info">
                        <span class="song-name">${song.name}</span>
                        <span class="song-id-badge">${song.id}</span>
                    </div>
                `;
                
                songListContainer.appendChild(li);
            });
        }

        searchInput.addEventListener('input', (e) => {

                renderSongs(songData);
                return;
            }

            const filteredSongs = songData.filter(song => {
                return song.name.toLowerCase().includes(keyword) || 
                       song.id.includes(keyword);
            });

            renderSongs(filteredSongs);
        });

        // 預設載入時就顯示所有歌單，直接呈現為索引
